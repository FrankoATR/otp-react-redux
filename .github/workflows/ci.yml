name: Node CI

on:
  push:
    branches: [feature/weather-cards]
  pull_request:
    branches: [feature/weather-cards]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and cache yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Lint
        run: yarn lint-all

      - name: Type check
        run: yarn typecheck

      - name: Run weather tests
        run: yarn test:openweather