name: Node CI (Windows)

on:
  push:
    branches: [feature/weather-cards]
  pull_request:
    branches: [feature/weather-cards]

jobs:
  build-test:
    runs-on: windows-latest

    strategy:
      matrix:
        node-version: [20.19.0]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js and cache yarn
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint-all

      - name: Type check
        run: yarn typecheck

      - name: Run weather tests
        run: yarn test:openweather